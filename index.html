<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Inter:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Varela+Round&display=swap"
        rel="stylesheet">
    <!-- Custom CSS for additional styling -->
    <style>
        .varela-round-regular {
            font-family: "Varela Round", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        body {
            background-color: #0d1117;
            /* Dark background */
            color: #c9d1d9;
            /* Light text color */
        }

        .header {
            background-color: #161b22;
            color: #58a6ff;
            /* Accent color */
        }

        .btn {
            background-color: #238636;
            /* Button color */
            border: none;
        }

        .btn:hover {
            background-color: #2ea043;
            /* Button hover color */
        }

        .card {
            background-color: #161b22;
            /* Card background */
        }

        .table th,
        .table td {
            color: #c9d1d9;
            /* Table text color */
        }

        .completed {
            text-decoration: line-through;
        }
    </style>
</head>

<body class="font-sans leading-normal tracking-normal min-h-screen justify-around">

    <div class="container mx-auto p-6 space-y-6">
        <div class="header rounded shadow-lg p-6">
            <h2 class="text-2xl font-semibold mb-4 text-white p-8 bg-slate-700 rounded-md">Angstrox Task Manger | LOCALSTORAGE</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
                <input type="text" id="title" class="w-full text-slate-600 p-2 border rounded" placeholder="Task Title">
                <select id="category" class="w-full text-slate-600 p-2 border rounded">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Other">Other</option>
                </select>
                <select id="priority" class="w-full text-slate-600 p-2 border rounded">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <select id="urgency" class="w-full text-slate-600 p-2 border rounded">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <input type="date" id="startDate" class="w-full text-slate-600 p-2 border rounded"
                    placeholder="Start Date">
                <input type="date" id="endDate" class="w-full text-slate-600 p-2 border rounded" placeholder="End Date">
            </div>
            <div class="flex justify-between space-x-2">
                <button id="add" class="btn text-white font-bold py-2 px-4 rounded">
                    <i class="fas fa-save"></i> Save
                </button>
                <button id="clear" class="btn bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    <i class="fas fa-trash"></i> Clear All
                </button>
                <button onclick="window.print();"
                    class="btn bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>

        <div class="card rounded shadow-lg p-6">
            <h3 class="text-xl font-bold mb-4">Pending Tasks</h3>
            <table class="min-w-full leading-normal table">
                <thead>
                    <tr>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('title')">
                            Title
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('category')">
                            Category
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('priority')">
                            Priority
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('urgency')">
                            Urgency
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('startDate')">
                            Start Date
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('endDate')">
                            End Date
                        </th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider">
                            Options
                        </th>
                    </tr>
                </thead>
                <tbody id="pendingTasks">
                    <!-- Pending tasks will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="card rounded shadow-lg p-6">
            <h3 class="text-xl font-bold mb-4">Completed Tasks</h3>
            <table class="min-w-full leading-normal table">
                <thead>
                    <tr>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('title')">
                            Title
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('category')">
                            Category
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('priority')">
                            Priority
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('urgency')">
                            Urgency
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('startDate')">
                            Start Date
                        </th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer"
                            onclick="sortTasks('endDate')">
                            End Date
                        </th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-700 text-left text-xs font-semibold uppercase tracking-wider">
                            Options
                        </th>
                    </tr>
                </thead>
                <tbody id="completedTasks">
                    <!-- Completed tasks will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="fixed inset-0 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-xl font-bold mb-4">Edit Task</h2>
            <input type="hidden" id="edit-id">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
                <input type="text" id="edit-title" class="w-full text-slate-600 p-2 border rounded"
                    placeholder="Task Title">
                <select id="edit-category" class="w-full text-slate-600 p-2 border rounded">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Other">Other</option>
                </select>
                <select id="edit-priority" class="w-full text-slate-600 p-2 border rounded">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <select id="edit-urgency" class="w-full text-slate-600 p-2 border rounded">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <input type="date" id="edit-startDate" class="w-full text-slate-600 p-2 border rounded"
                    placeholder="Start Date">
                <input type="date" id="edit-endDate" class="w-full text-slate-600 p-2 border rounded"
                    placeholder="End Date">
            </div>
            <div class="flex justify-end space-x-2">
                <button class="btn bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
                    onclick="closeEditModal()">
                    Cancel
                </button>
                <button class="btn text-white font-bold py-2 px-4 rounded" onclick="updateTask()">
                    Save
                </button>
            </div>
        </div>
    </div>

    <script>
        function generateTaskRow(task, index, isCompleted) {
            const completedClass = isCompleted ? 'completed' : '';
            return `
                <tr class="${completedClass}">
                    <td class="px-5 py-5 border-b border-gray-200 bg-gray-800 text-sm">${task.title}</td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-gray-800 text-sm">${task.category}</td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-gray-800 text-sm">${task.priority}</td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-gray-800 text-sm">${task.urgency}</td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-gray-800 text-sm">${task.startDate}</td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-gray-800 text-sm">${task.endDate}</td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-gray-800 text-sm space-x-2">
                        <button class="btn bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 rounded" onclick="confirmDelete('${task.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="btn bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-1 px-2 rounded" onclick="showEditModal('${task.id}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        ${!isCompleted ? `<button class="btn bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-2 rounded" onclick="completeTask('${task.id}')">
                            <i class="fas fa-check"></i>
                        </button>` : ''}
                    </td>
                </tr>
            `;
        }

        function loadTasks() {
            const pendingTasksContainer = document.querySelector('#pendingTasks');
            const completedTasksContainer = document.querySelector('#completedTasks');
            pendingTasksContainer.innerHTML = '';
            completedTasksContainer.innerHTML = '';

            for (let i = 0; i < localStorage.length; i++) {
                const task = JSON.parse(localStorage.getItem(localStorage.key(i)));
                if (task.completed) {
                    completedTasksContainer.innerHTML += generateTaskRow(task, i, true);
                } else {
                    pendingTasksContainer.innerHTML += generateTaskRow(task, i, false);
                }
            }
        }

        function saveTask(task) {
            const id = new Date().getTime().toString();
            task.id = id;
            localStorage.setItem(id, JSON.stringify(task));
        }

        function updateTask() {
            const id = document.querySelector('#edit-id').value;
            const title = document.querySelector('#edit-title').value;
            const category = document.querySelector('#edit-category').value;
            const priority = document.querySelector('#edit-priority').value;
            const urgency = document.querySelector('#edit-urgency').value;
            const startDate = document.querySelector('#edit-startDate').value;
            const endDate = document.querySelector('#edit-endDate').value;

            const updatedTask = {
                id,
                title,
                category,
                priority,
                urgency,
                startDate,
                endDate,
                completed: false
            };

            localStorage.setItem(id, JSON.stringify(updatedTask));
            loadTasks();
            closeEditModal();
        }

        function deleteTask(id) {
            localStorage.removeItem(id);
            loadTasks();
        }

        function completeTask(id) {
            const task = JSON.parse(localStorage.getItem(id));
            task.completed = true;
            localStorage.setItem(id, JSON.stringify(task));
            loadTasks();
        }

        document.querySelector('#add').addEventListener('click', () => {
            const title = document.querySelector('#title').value;
            const category = document.querySelector('#category').value;
            const priority = document.querySelector('#priority').value;
            const urgency = document.querySelector('#urgency').value;
            const startDate = document.querySelector('#startDate').value;
            const endDate = document.querySelector('#endDate').value;

            if (title && startDate && endDate) {
                const task = {
                    title,
                    category,
                    priority,
                    urgency,
                    startDate,
                    endDate,
                    completed: false
                };
                saveTask(task);
                loadTasks();
            } else {
                alert("Please enter all task details.");
            }
        });

        document.querySelector('#clear').addEventListener('click', () => {
            localStorage.clear();
            loadTasks();
        });

        function confirmDelete(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                deleteTask(id);
            }
        }

        function showEditModal(id) {
            const task = JSON.parse(localStorage.getItem(id));
            document.querySelector('#edit-id').value = id;
            document.querySelector('#edit-title').value = task.title;
            document.querySelector('#edit-category').value = task.category;
            document.querySelector('#edit-priority').value = task.priority;
            document.querySelector('#edit-urgency').value = task.urgency;
            document.querySelector('#edit-startDate').value = task.startDate;
            document.querySelector('#edit-endDate').value = task.endDate;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function sortTasks(field) {
            const tasks = [];
            for (let i = 0; i < localStorage.length; i++) {
                const task = JSON.parse(localStorage.getItem(localStorage.key(i)));
                task.id = localStorage.key(i);
                tasks.push(task);
            }

            tasks.sort((a, b) => {
                if (a[field] < b[field]) return -1;
                if (a[field] > b[field]) return 1;
                return 0;
            });

            localStorage.clear();
            tasks.forEach(task => {
                localStorage.setItem(task.id, JSON.stringify(task));
            });

            loadTasks();
        }

        window.onload = loadTasks;
    </script>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-10">
        &copy; 2024 Ismail Mouyahada. All rights reserved.
    </footer>

</body>

</html>
